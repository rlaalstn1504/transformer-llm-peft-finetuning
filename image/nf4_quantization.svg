<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc">
  <title id="title">NF4 양자화: 정규분포에 맞춘 16개 값</title>
  <desc id="desc">같은 간격의 일반 4비트 값과 정규분포 분위수에 맞춘 NF4 값을 비교하고, 가중치를 블록 최댓값으로 나눈 뒤 가장 가까운 NF4 값의 번호를 저장했다가 계산할 때 BF16으로 복원하는 과정</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .label { font: 15px sans-serif; fill: #0f172a; text-anchor: middle; }
      .head { font: bold 16px sans-serif; fill: #0f172a; }
      .small { font: 13px sans-serif; fill: #334155; text-anchor: middle; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="590" fill="#ffffff"/>
  <text x="380.0" y="28" class="label" font-weight="700" font-size="17">NF4 양자화: 4비트로 표현할 16개 값을 어디에 둘까?</text>

