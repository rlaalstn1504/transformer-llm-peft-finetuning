  <rect x="45" y="185" width="230" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="160" y="210" text-anchor="middle" class="body" >사용자 질문</text>
  <line x1="160" y1="227" x2="160" y2="258" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
  <rect x="345" y="125" width="100" height="48" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="395" y="154" text-anchor="middle" class="body" >사용자 질문</text>
  <rect x="475" y="125" width="100" height="48" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="525" y="146" text-anchor="middle" class="body" >문서 DB</text>
  <text x="525" y="164" text-anchor="middle" class="tiny" >검색</text>
  <line x1="447" y1="149" x2="472" y2="149" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="345" y="185" width="230" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="460" y="210" text-anchor="middle" class="body" >★ 검색 문서 + 질문</text>
  <line x1="525" y1="175" x2="525" y2="183" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="460" y1="227" x2="460" y2="258" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <rect x="645" y="125" width="230" height="48" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="760" y="146" text-anchor="middle" class="body" >★ 학습 데이터 (지시, 답변)</text>
  <text x="760" y="164" text-anchor="middle" class="tiny" >학습은 미리 한 번 수행</text>
  <rect x="645" y="185" width="230" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="760" y="210" text-anchor="middle" class="body" >사용자 질문 (짧은 프롬프트)</text>
  <path d="M 650 150 C 615 200, 640 280, 686 288" fill="none" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <line x1="760" y1="227" x2="760" y2="258" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arrow-green)"/>
</svg>
