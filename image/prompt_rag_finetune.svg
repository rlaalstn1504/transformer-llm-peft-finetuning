<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Prompt, RAG, Fine-tuning 비교</title>
  <desc id="desc">Prompt Engineering은 지시문을, RAG는 참고 자료를, Fine-tuning은 모델 가중치를 바꿔 LLM의 동작을 업무에 맞춘다.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L9,4 z" fill="#64748b"/></marker>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L9,4 z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="7" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L9,4 z" fill="#0f766e"/></marker>
    <marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L9,4 z" fill="#ea580c"/></marker>
    <marker id="arrow-purple" markerWidth="7" markerHeight="7" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L9,4 z" fill="#7c3aed"/></marker>

    <style>
      text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'NanumGothic', sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 14px; font-weight: 500; fill: #4b5563; }
      .box-title { font-size: 15px; font-weight: 700; fill: #111827; }
      .body { font-size: 13px; font-weight: 500; fill: #334155; }
      .small { font-size: 12px; font-weight: 500; fill: #475569; }
      .tiny { font-size: 11px; font-weight: 500; fill: #64748b; }
      .mono { font-family: Consolas, 'D2Coding', monospace; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .lane { font-size: 15px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <rect width="920" height="360" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" class="title" >무엇을 바꾸는가: 지시문 / 참고 자료 / 가중치</text>
  <rect x="20" y="55" width="280" height="290" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="160" y="83" text-anchor="middle" class="box-title" >Prompt Engineering</text>
  <text x="160" y="103" text-anchor="middle" class="small" >지시문을 바꾼다</text>
  <rect x="90" y="262" width="140" height="56" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="160" y="288" text-anchor="middle" class="box-title" >LLM</text>
  <text x="160" y="306" text-anchor="middle" class="tiny" >가중치 그대로</text>
  <rect x="320" y="55" width="280" height="290" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="460" y="83" text-anchor="middle" class="box-title" >RAG</text>
  <text x="460" y="103" text-anchor="middle" class="small" >참고 자료를 넣는다</text>
  <rect x="390" y="262" width="140" height="56" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="460" y="288" text-anchor="middle" class="box-title" >LLM</text>
  <text x="460" y="306" text-anchor="middle" class="tiny" >가중치 그대로</text>
  <rect x="620" y="55" width="280" height="290" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="760" y="83" text-anchor="middle" class="box-title" >Fine-tuning (SFT·PEFT)</text>
  <text x="760" y="103" text-anchor="middle" class="small" >가중치를 바꾼다</text>
  <rect x="690" y="262" width="140" height="56" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text x="760" y="288" text-anchor="middle" class="box-title" >LLM</text>
  <text x="760" y="306" text-anchor="middle" class="tiny" >가중치 조정됨 (LoRA)</text>
