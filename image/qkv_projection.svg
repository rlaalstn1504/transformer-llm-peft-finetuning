<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <rect width="1500" height="760" fill="#ffffff"/>

  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f97316"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <g font-family="Noto Sans CJK KR, Apple SD Gothic Neo, Arial, sans-serif">
    <text x="750" y="43" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Self-Attention에서 Q, K, V를 만드는 행렬곱</text>
    <text x="750" y="72" text-anchor="middle" font-size="17" fill="#475569">원 논문 한 개 head 기준 · seq_len=10은 shape를 따라가기 위한 예시</text>

    <g transform="translate(430,88)">
      <rect width="175" height="36" rx="18" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="87.5" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">예시 seq_len = 10</text>
    </g>
    <g transform="translate(620,88)">
      <rect width="188" height="36" rx="18" fill="#eef2ff" stroke="#a5b4fc"/>
      <text x="94" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">논문 d_model = 512</text>
    </g>
    <g transform="translate(823,88)">
      <rect width="248" height="36" rx="18" fill="#faf5ff" stroke="#d8b4fe"/>
      <text x="124" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#7e22ce">논문 h = 8, d_k = d_v = 64</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="38" y="248" width="240" height="250" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    </g>
    <text x="158" y="285" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">토큰 표현 X</text>
    <text x="158" y="316" text-anchor="middle" font-size="16" fill="#475569">(seq_len, d_model)</text>

    <g stroke="#cbd5e1" stroke-width="1">
      <rect x="83" y="338" width="150" height="75" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="113" y1="338" x2="113" y2="413"/>
      <line x1="143" y1="338" x2="143" y2="413"/>
      <line x1="173" y1="338" x2="173" y2="413"/>
      <line x1="203" y1="338" x2="203" y2="413"/>
      <line x1="83" y1="363" x2="233" y2="363"/>
      <line x1="83" y1="388" x2="233" y2="388"/>
    </g>
    <text x="158" y="444" text-anchor="middle" font-size="26" font-weight="800" fill="#0f172a">(10, 512)</text>
    <text x="158" y="474" text-anchor="middle" font-size="15" fill="#64748b">10개 토큰 × 토큰당 512차원</text>

    <g filter="url(#shadow)">
      <rect x="350" y="140" width="320" height="130" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
      <rect x="350" y="315" width="320" height="130" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
      <rect x="350" y="490" width="320" height="130" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    </g>

    <text x="510" y="174" text-anchor="middle" font-size="22" font-weight="800" fill="#1d4ed8">Linear의 학습 행렬 W_Qⁱ</text>
    <text x="510" y="204" text-anchor="middle" font-size="16" fill="#475569">shape (d_model, d_k)</text>
    <text x="510" y="241" text-anchor="middle" font-size="27" font-weight="800" fill="#1e40af">(512, 64)</text>

    <text x="510" y="349" text-anchor="middle" font-size="22" font-weight="800" fill="#c2410c">Linear의 학습 행렬 W_Kⁱ</text>
    <text x="510" y="379" text-anchor="middle" font-size="16" fill="#475569">shape (d_model, d_k)</text>
    <text x="510" y="416" text-anchor="middle" font-size="27" font-weight="800" fill="#9a3412">(512, 64)</text>

    <text x="510" y="524" text-anchor="middle" font-size="22" font-weight="800" fill="#047857">Linear의 학습 행렬 W_Vⁱ</text>
    <text x="510" y="554" text-anchor="middle" font-size="16" fill="#475569">shape (d_model, d_v)</text>
    <text x="510" y="591" text-anchor="middle" font-size="27" font-weight="800" fill="#065f46">(512, 64)</text>

    <g filter="url(#shadow)">
      <rect x="745" y="150" width="255" height="110" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
      <rect x="745" y="325" width="255" height="110" rx="16" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
      <rect x="745" y="500" width="255" height="110" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    </g>

    <text x="872" y="180" text-anchor="middle" font-size="21" font-weight="800" fill="#1d4ed8">Q = XW_Qⁱ</text>
    <text x="872" y="210" text-anchor="middle" font-size="16" fill="#334155">(10, 512) × (512, 64)</text>
    <text x="872" y="241" text-anchor="middle" font-size="24" font-weight="800" fill="#1e40af">= (10, 64)</text>

    <text x="872" y="355" text-anchor="middle" font-size="21" font-weight="800" fill="#c2410c">K = XW_Kⁱ</text>
    <text x="872" y="385" text-anchor="middle" font-size="16" fill="#334155">(10, 512) × (512, 64)</text>
    <text x="872" y="416" text-anchor="middle" font-size="24" font-weight="800" fill="#9a3412">= (10, 64)</text>

    <text x="872" y="530" text-anchor="middle" font-size="21" font-weight="800" fill="#047857">V = XW_Vⁱ</text>
    <text x="872" y="560" text-anchor="middle" font-size="16" fill="#334155">(10, 512) × (512, 64)</text>
    <text x="872" y="591" text-anchor="middle" font-size="24" font-weight="800" fill="#065f46">= (10, 64)</text>

    <g filter="url(#shadow)">
      <rect x="1080" y="150" width="380" height="460" rx="20" fill="#faf5ff" stroke="#a78bfa" stroke-width="2"/>
    </g>
    <text x="1270" y="188" text-anchor="middle" font-size="23" font-weight="800" fill="#6d28d9">한 개 head의 Attention</text>

    <rect x="1110" y="215" width="320" height="105" rx="13" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="1132" y="244" font-size="16" font-weight="700" fill="#6d28d9">① 모든 토큰 쌍의 점수</text>
    <text x="1270" y="277" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">QKᵀ : (10, 64) × (64, 10)</text>
    <text x="1270" y="304" text-anchor="middle" font-size="23" font-weight="800" fill="#6d28d9">= (10, 10)</text>

    <rect x="1110" y="340" width="320" height="78" rx="13" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="1132" y="369" font-size="16" font-weight="700" fill="#6d28d9">② scale + softmax</text>
    <text x="1270" y="400" text-anchor="middle" font-size="17" fill="#475569">토큰마다 참고 비중 생성 · (10, 10)</text>

    <rect x="1110" y="438" width="320" height="125" rx="13" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="1132" y="468" font-size="16" font-weight="700" fill="#6d28d9">③ 참고 비중으로 V 합산</text>
    <text x="1270" y="501" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">(10, 10) × (10, 64)</text>
    <text x="1270" y="532" text-anchor="middle" font-size="24" font-weight="800" fill="#6d28d9">head 출력 = (10, 64)</text>

    <path d="M278 350 C315 350, 310 205, 338 205" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <path d="M278 373 L338 380" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
    <path d="M278 396 C315 396, 310 555, 338 555" fill="none" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-green)"/>

    <line x1="670" y1="205" x2="733" y2="205" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <line x1="670" y1="380" x2="733" y2="380" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
    <line x1="670" y1="555" x2="733" y2="555" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-green)"/>

    <path d="M1000 205 C1038 205, 1038 248, 1068 248" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <path d="M1000 380 C1038 380, 1038 288, 1068 288" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
    <path d="M1000 555 C1040 555, 1038 500, 1068 500" fill="none" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-green)"/>

    <rect x="38" y="660" width="1422" height="70" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="68" y="690" font-size="17" font-weight="800" fill="#334155">논문의 8개 head를 합치면</text>
    <text x="330" y="690" font-size="18" fill="#475569">8 × (10, 64)</text>
    <text x="490" y="690" font-size="22" font-weight="700" fill="#64748b">→</text>
    <text x="535" y="690" font-size="18" fill="#475569">Concat (10, 512)</text>
    <text x="745" y="690" font-size="22" font-weight="700" fill="#64748b">→</text>
    <text x="790" y="690" font-size="18" fill="#475569">W_O (512, 512)</text>
    <text x="988" y="690" font-size="22" font-weight="700" fill="#64748b">→</text>
    <text x="1033" y="690" font-size="20" font-weight="800" fill="#0f172a">최종 출력 (10, 512)</text>
    <text x="68" y="716" font-size="14" fill="#64748b">W_Qⁱ, W_Kⁱ, W_Vⁱ는 head마다 따로 학습되는 Linear 가중치 행렬입니다.</text>
  </g>
</svg>
