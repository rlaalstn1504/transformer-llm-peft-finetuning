<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" role="img" aria-labelledby="title desc">
  <title id="title">Cross-Attention의 Query, Key, Value 출처</title>
  <desc id="desc">Decoder의 현재 표현에서 Query를 만들고 Encoder 출력에서 Key와 Value를 만들어, Decoder가 입력 문장의 필요한 부분을 참고한다.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L9,4 z" fill="#64748b"/></marker>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L9,4 z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="7" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L9,4 z" fill="#0f766e"/></marker>
    <marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L9,4 z" fill="#ea580c"/></marker>
    <marker id="arrow-purple" markerWidth="7" markerHeight="7" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L9,4 z" fill="#7c3aed"/></marker>

    <style>
      text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'NanumGothic', sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 14px; font-weight: 500; fill: #4b5563; }
      .box-title { font-size: 15px; font-weight: 700; fill: #111827; }
      .body { font-size: 13px; font-weight: 500; fill: #334155; }
      .small { font-size: 12px; font-weight: 500; fill: #475569; }
      .tiny { font-size: 11px; font-weight: 500; fill: #64748b; }
      .mono { font-family: Consolas, 'D2Coding', monospace; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .lane { font-size: 15px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <rect width="840" height="340" fill="#ffffff"/>
  <text x="420" y="32" text-anchor="middle" class="title" >Cross-Attention: Decoder가 입력 문장을 참고하는 방법</text>
  <rect x="25" y="65" width="230" height="240" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="92" text-anchor="middle" class="box-title" >Encoder</text>
  <rect x="40" y="250" width="34" height="34" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="57.0" y="272" text-anchor="middle" class="small" >I</text>
  <rect x="80" y="250" width="40" height="34" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="100.0" y="272" text-anchor="middle" class="small" >am</text>
  <rect x="126" y="250" width="34" height="34" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="143.0" y="272" text-anchor="middle" class="small" >a</text>
  <rect x="166" y="250" width="70" height="34" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="201.0" y="272" text-anchor="middle" class="small" >student</text>
  <rect x="45" y="120" width="190" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="142" text-anchor="middle" class="body" >입력 문장의 문맥 표현</text>
  <text x="140" y="160" text-anchor="middle" class="tiny" >(입력 길이 4, d_model)</text>
  <line x1="140" y1="248" x2="140" y2="173" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="140" y="215" text-anchor="middle" class="small" >Self-Attention × N</text>
  <rect x="585" y="65" width="230" height="240" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="700" y="92" text-anchor="middle" class="box-title" >Decoder</text>
  <rect x="605" y="250" width="58" height="34" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="634" y="272" text-anchor="middle" class="small" >&lt;시작&gt;</text>
  <rect x="671" y="250" width="58" height="34" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="700" y="272" text-anchor="middle" class="small" >저는</text>
  <rect x="737" y="250" width="58" height="34" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="766" y="272" text-anchor="middle" class="small" >학생</text>
  <rect x="605" y="120" width="190" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="700" y="142" text-anchor="middle" class="body" >Masked Self-Attention</text>
  <text x="700" y="160" text-anchor="middle" class="tiny" >(출력 길이 3, d_model)</text>
  <line x1="700" y1="248" x2="700" y2="173" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <rect x="310" y="110" width="220" height="110" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="420" y="138" text-anchor="middle" class="box-title" >Cross-Attention</text>
  <text x="420" y="162" text-anchor="middle" class="mono" >softmax(QKᵀ/√dₖ)V</text>
  <text x="420" y="186" text-anchor="middle" class="small" >가중치 shape: (3, 4)</text>
  <text x="420" y="205" text-anchor="middle" class="tiny" >출력 위치마다 입력 4개를 참고</text>
  <line x1="237" y1="138" x2="306" y2="138" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="272" y="128" text-anchor="middle" class="small" >Key</text>
  <line x1="237" y1="158" x2="306" y2="158" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="272" y="176" text-anchor="middle" class="small" >Value</text>
  <line x1="603" y1="145" x2="534" y2="145" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arrow-green)"/>
  <text x="568" y="135" text-anchor="middle" class="small" >Query</text>
  <line x1="420" y1="222" x2="420" y2="262" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#arrow-purple)"/>
  <rect x="345" y="264" width="150" height="40" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="420" y="289" text-anchor="middle" class="body" >다음 토큰: 입니다</text>
</svg>
