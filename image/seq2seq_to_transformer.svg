<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500">
  <rect width="1180" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="590" y="42" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">입력 정보를 출력으로 전달하는 방법의 변화</text>

  <rect x="35" y="78" width="340" height="360" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="205" y="116" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="21" font-weight="700" fill="#c2410c">1. Seq2Seq</text>
  <text x="205" y="145" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="15" fill="#475569">입력을 하나의 고정 벡터로 압축</text>

  <rect x="68" y="190" width="105" height="72" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="120" y="219" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">RNN</text>
  <text x="120" y="243" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="14" fill="#475569">Encoder</text>
  <circle cx="212" cy="226" r="38" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <text x="212" y="221" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">고정</text>
  <text x="212" y="241" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">context</text>
  <rect x="252" y="190" width="90" height="72" rx="12" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
  <text x="297" y="219" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="17" font-weight="700" fill="#c2410c">RNN</text>
  <text x="297" y="243" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="14" fill="#475569">Decoder</text>
  <line x1="173" y1="226" x2="174" y2="226" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="250" y1="226" x2="252" y2="226" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="205" y="320" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">긴 입력에서 정보 병목</text>
  <text x="205" y="350" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="15" fill="#475569">RNN 계산은 순차적</text>

  <rect x="420" y="78" width="340" height="360" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="590" y="116" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">2. Seq2Seq + Attention</text>
  <text x="590" y="145" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="15" fill="#475569">모든 Encoder 상태를 선택적으로 참고</text>

  <g fill="#dbeafe" stroke="#60a5fa" stroke-width="2">
    <rect x="456" y="190" width="54" height="54" rx="8"/>
    <rect x="522" y="190" width="54" height="54" rx="8"/>
    <rect x="588" y="190" width="54" height="54" rx="8"/>
  </g>
  <text x="549" y="266" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="14" fill="#475569">Encoder hidden states</text>
  <ellipse cx="653" cy="307" rx="66" ry="38" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="653" y="313" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="16" font-weight="700" fill="#6d28d9">Attention</text>
  <rect x="658" y="190" width="70" height="54" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
  <text x="693" y="223" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="15" font-weight="700" fill="#c2410c">Decoder</text>
  <path d="M483 244 C495 295, 565 307, 580 307" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M549 244 C555 280, 585 297, 590 298" fill="none" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M615 244 C620 272, 625 278, 628 280" fill="none" stroke="#8b5cf6" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="653" y1="269" x2="683" y2="249" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="590" y="370" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">고정 벡터 병목 완화</text>
  <text x="590" y="400" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="15" fill="#475569">RNN 계산은 여전히 순차적</text>

  <rect x="805" y="78" width="340" height="360" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="975" y="116" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="21" font-weight="700" fill="#047857">3. Transformer</text>
  <text x="975" y="145" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="15" fill="#475569">순환 없이 토큰 관계를 직접 계산</text>

  <g fill="#dcfce7" stroke="#22c55e" stroke-width="2">
    <rect x="844" y="194" width="58" height="54" rx="8"/>
    <rect x="915" y="194" width="58" height="54" rx="8"/>
    <rect x="986" y="194" width="58" height="54" rx="8"/>
    <rect x="1057" y="194" width="58" height="54" rx="8"/>
  </g>
  <g stroke="#2563eb" stroke-width="2" opacity="0.85">
    <line x1="873" y1="194" x2="944" y2="194"/>
    <line x1="873" y1="194" x2="1015" y2="194"/>
    <line x1="944" y1="248" x2="1086" y2="248"/>
    <line x1="1015" y1="194" x2="1086" y2="194"/>
  </g>
  <rect x="885" y="292" width="180" height="62" rx="12" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/>
  <text x="975" y="319" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="17" font-weight="700" fill="#047857">Self-Attention</text>
  <text x="975" y="343" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="14" fill="#475569">토큰 위치를 병렬 계산</text>
  <text x="975" y="394" text-anchor="middle" font-family="Noto Sans CJK KR, Arial, sans-serif" font-size="16" font-weight="700" fill="#047857">짧은 관계 전달 경로</text>
</svg>
