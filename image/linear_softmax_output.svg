<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">Linear + Softmax: Decoder 출력을 다음 토큰 확률로 바꾸기</title>
  <desc id="desc">Decoder 마지막 위치의 벡터를 Linear 층이 사전 크기만큼의 점수(로짓)로 바꾸고, Softmax가 그 점수를 합이 1인 확률분포로 바꾼다. 가장 확률이 높은 토큰을 다음 토큰으로 선택한다.</desc>
  <defs>
    <marker id="arrow-gray3" markerWidth="7" markerHeight="7" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L9,4 z" fill="#64748b"/></marker>
    <style>
      text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'NanumGothic', sans-serif; }
      .title { font-size: 19px; font-weight: 700; fill: #111827; }
      .box-title { font-size: 14px; font-weight: 700; fill: #111827; }
      .group-title { font-size: 12.5px; font-weight: 700; fill: #334155; }
      .tiny { font-size: 11px; font-weight: 500; fill: #64748b; }
      .small { font-size: 13px; font-weight: 600; fill: #334155; }
      .token { font-size: 11px; font-weight: 600; fill: #334155; }
      .caption { font-size: 12.5px; font-weight: 500; fill: #475569; }
      .pct { font-size: 13px; font-weight: 700; fill: #5b21b6; }
    </style>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" class="title">Linear + Softmax: Decoder 출력을 다음 토큰 확률로 바꾸기</text>

  <!-- vector box -->
  <rect x="30" y="160" width="110" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="85" y="190" text-anchor="middle" class="small">마지막 벡터</text>
  <text x="85" y="208" text-anchor="middle" class="tiny">(d_model)</text>

  <line x1="140" y1="195" x2="172" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray3)"/>

  <!-- linear box -->
  <rect x="175" y="160" width="110" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="230" y="190" text-anchor="middle" class="small" fill="#1d4ed8">Linear</text>
  <text x="230" y="208" text-anchor="middle" class="tiny">(d_model → 어휘 수)</text>

  <line x1="285" y1="195" x2="322" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray3)"/>

  <!-- logits bar group -->
  <text x="445" y="148" text-anchor="middle" class="group-title">로짓(logits): 사전 속 각 토큰 점수</text>
  <line x1="330" y1="330" x2="560" y2="330" stroke="#cbd5e1" stroke-width="1.3"/>
  <g>
    <rect x="330" y="190" width="26" height="140" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="343" y="345" text-anchor="middle" class="token">학생</text>
    <rect x="371" y="240" width="26" height="90" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="384" y="345" text-anchor="middle" class="token">사과</text>
    <rect x="412" y="273" width="26" height="57" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="425" y="345" text-anchor="middle" class="token">가방</text>
    <rect x="453" y="280" width="26" height="50" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="466" y="345" text-anchor="middle" class="token">영화</text>
    <rect x="494" y="302" width="26" height="28" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="507" y="345" text-anchor="middle" class="token">구름</text>
    <rect x="535" y="320" width="26" height="10" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="548" y="345" text-anchor="middle" class="token">공원</text>
  </g>

  <line x1="565" y1="195" x2="612" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray3)"/>

  <!-- softmax box -->
  <rect x="615" y="160" width="100" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="665" y="190" text-anchor="middle" class="small" fill="#5b21b6">Softmax</text>
  <text x="665" y="208" text-anchor="middle" class="tiny">(점수 → 확률)</text>

  <line x1="715" y1="195" x2="752" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray3)"/>

  <!-- probability bar group -->
  <text x="875" y="148" text-anchor="middle" class="group-title">확률분포 (합 = 1)</text>
  <text x="773" y="178" text-anchor="middle" class="pct">0.67</text>
  <line x1="760" y1="330" x2="990" y2="330" stroke="#cbd5e1" stroke-width="1.3"/>
  <g>
    <rect x="760" y="190" width="26" height="140" fill="#7c3aed" stroke="#5b21b6" stroke-width="1.3"/>
    <text x="773" y="345" text-anchor="middle" class="token">학생</text>
    <rect x="801" y="297" width="26" height="33" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="814" y="345" text-anchor="middle" class="token">사과</text>
    <rect x="842" y="315" width="26" height="15" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="855" y="345" text-anchor="middle" class="token">가방</text>
    <rect x="883" y="320" width="26" height="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="896" y="345" text-anchor="middle" class="token">영화</text>
    <rect x="924" y="322" width="26" height="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="937" y="345" text-anchor="middle" class="token">구름</text>
    <rect x="965" y="324" width="26" height="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="978" y="345" text-anchor="middle" class="token">공원</text>
  </g>

  <text x="500" y="378" text-anchor="middle" class="caption">가장 확률이 높은 토큰(또는 확률적 샘플링으로 고른 토큰)을 다음 토큰으로 선택합니다.</text>
</svg>
