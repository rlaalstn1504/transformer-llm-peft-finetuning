<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">2층 신경망의 노드 수와 행렬 모양</title>
  <desc id="desc">입력 노드 3개, 은닉 노드 5개, 출력 노드 3개가 보인다. 가중치 W1은 3행 5열, W2는 5행 3열이다. 샘플 4개를 한 번에 계산할 때 텐서 모양은 4행 3열에서 4행 5열을 거쳐 4행 3열이 된다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker>
    <style>
      text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'NanumGothic', sans-serif; }
      .title { font-size: 27px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 18px; fill: #334155; }
      .stage { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .shape { font-size: 21px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; fill: #334155; }
      .small { font-size: 16px; fill: #475569; }
      .equation { font-size: 22px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="43" text-anchor="middle" class="title">2층 신경망: 노드 수와 shape 변화</text>
  <text x="600" y="77" text-anchor="middle" class="subtitle">동그라미는 샘플 1개의 특성 수 · 샘플 4개는 같은 신경망에 한꺼번에 넣습니다</text>
  <rect x="40" y="132" width="220" height="250" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="150" y="172" class="stage" text-anchor="middle">입력 x</text>
  <text x="150" y="203" class="shape" text-anchor="middle" fill="#1d4ed8">특성 3개</text>
  <circle cx="103" cy="237" r="11" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="128" y="243" class="small">센서 1</text>
  <circle cx="103" cy="273" r="11" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="128" y="279" class="small">센서 2</text>
  <circle cx="103" cy="309" r="11" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="128" y="315" class="small">센서 3</text>
  <text x="150" y="355" class="small" text-anchor="middle">배치 shape (4, 3)</text>
  <rect x="290" y="152" width="160" height="230" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="370" y="190" class="stage" text-anchor="middle">가중치 W₁</text>
  <text x="370" y="218" class="shape" text-anchor="middle" fill="#0f172a">(3, 5)</text>
  <rect x="317.5" y="235" width="105" height="66" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="338.5" y1="235" x2="338.5" y2="301" stroke="#1d4ed8" stroke-opacity="0.65" stroke-width="1.3"/>
  <line x1="359.5" y1="235" x2="359.5" y2="301" stroke="#1d4ed8" stroke-opacity="0.65" stroke-width="1.3"/>
  <line x1="380.5" y1="235" x2="380.5" y2="301" stroke="#1d4ed8" stroke-opacity="0.65" stroke-width="1.3"/>
  <line x1="401.5" y1="235" x2="401.5" y2="301" stroke="#1d4ed8" stroke-opacity="0.65" stroke-width="1.3"/>
  <line x1="317.5" y1="257" x2="422.5" y2="257" stroke="#1d4ed8" stroke-opacity="0.65" stroke-width="1.3"/>
  <line x1="317.5" y1="279" x2="422.5" y2="279" stroke="#1d4ed8" stroke-opacity="0.65" stroke-width="1.3"/>
  <text x="370" y="344" class="label" text-anchor="middle">3행 × 5열</text>
  <text x="370" y="366" class="small" text-anchor="middle">입력 3 → 은닉 5</text>
  <rect x="480" y="132" width="220" height="250" rx="18" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="590" y="172" class="stage" text-anchor="middle">은닉 표현 h₂</text>
  <text x="590" y="203" class="shape" text-anchor="middle" fill="#6d28d9">노드 5개</text>
  <circle cx="590" cy="224" r="11" fill="#8b5cf6" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="590" cy="248" r="11" fill="#8b5cf6" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="590" cy="272" r="11" fill="#8b5cf6" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="590" cy="296" r="11" fill="#8b5cf6" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="590" cy="320" r="11" fill="#8b5cf6" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="590" y="355" class="small" text-anchor="middle">배치 shape (4, 5)</text>
  <rect x="730" y="152" width="180" height="230" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="820" y="190" class="stage" text-anchor="middle">가중치 W₂</text>
  <text x="820" y="218" class="shape" text-anchor="middle" fill="#0f172a">(5, 3)</text>
  <rect x="781" y="230" width="78" height="90" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <line x1="807" y1="230" x2="807" y2="320" stroke="#6d28d9" stroke-opacity="0.65" stroke-width="1.3"/>
  <line x1="833" y1="230" x2="833" y2="320" stroke="#6d28d9" stroke-opacity="0.65" stroke-width="1.3"/>
  <line x1="781" y1="248" x2="859" y2="248" stroke="#6d28d9" stroke-opacity="0.65" stroke-width="1.3"/>
  <line x1="781" y1="266" x2="859" y2="266" stroke="#6d28d9" stroke-opacity="0.65" stroke-width="1.3"/>
  <line x1="781" y1="284" x2="859" y2="284" stroke="#6d28d9" stroke-opacity="0.65" stroke-width="1.3"/>
  <line x1="781" y1="302" x2="859" y2="302" stroke="#6d28d9" stroke-opacity="0.65" stroke-width="1.3"/>
  <text x="820" y="344" class="label" text-anchor="middle">5행 × 3열</text>
  <text x="820" y="366" class="small" text-anchor="middle">은닉 5 → 출력 3</text>
  <rect x="940" y="132" width="220" height="250" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="1050" y="172" class="stage" text-anchor="middle">출력 z</text>
  <text x="1050" y="203" class="shape" text-anchor="middle" fill="#c2410c">점수 3개</text>
  <circle cx="1003" cy="237" r="11" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
  <text x="1028" y="243" class="small">정상</text>
  <circle cx="1003" cy="273" r="11" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
  <text x="1028" y="279" class="small">주의</text>
  <circle cx="1003" cy="309" r="11" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
  <text x="1028" y="315" class="small">고장</text>
  <text x="1050" y="355" class="small" text-anchor="middle">배치 shape (4, 3)</text>
  <line x1="265" y1="255" x2="284" y2="255" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="455" y1="255" x2="474" y2="255" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="705" y1="255" x2="724" y2="255" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="915" y1="255" x2="934" y2="255" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="48" y="425" class="label">샘플 4개를 함께 계산할 때</text>
  <rect x="40" y="442" width="1120" height="61" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="513" width="1120" height="61" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="66" y="480" class="label" fill="#1d4ed8">선형층 1</text>
  <text x="265" y="480" class="equation">x (4, 3) @ W₁ (3, 5) + b₁  →  h₁ (4, 5)</text>
  <text x="66" y="551" class="label" fill="#6d28d9">선형층 2</text>
  <text x="265" y="551" class="equation">h₂ (4, 5) @ W₂ (5, 3) + b₂  →  z (4, 3)</text>
  <text x="600" y="606" class="small" text-anchor="middle">h₂ = ReLU(h₁) · ReLU와 softmax는 shape를 바꾸지 않습니다 · 샘플 수 4는 끝까지 유지됩니다</text>
</svg>
