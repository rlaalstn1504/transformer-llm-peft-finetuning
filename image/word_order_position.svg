<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
  <title id="title">위치 정보가 없을 때와 있을 때의 문장 순서 표현</title>
  <desc id="desc">같은 단어를 다른 순서로 놓은 두 문장이 위치 정보가 없으면 같은 단어 묶음으로 보이고, 위치 번호를 더하면 서로 다른 표현이 되는 과정을 나타낸다.</desc>
  <style>
    .label { font: 700 24px 'Noto Sans KR', Arial, sans-serif; fill: #183153; }
    .small { font: 500 18px 'Noto Sans KR', Arial, sans-serif; fill: #3f526d; }
    .token { font: 700 22px 'Noto Sans KR', Arial, sans-serif; fill: #183153; text-anchor: middle; dominant-baseline: middle; }
    .badge { font: 700 16px Arial, sans-serif; fill: white; text-anchor: middle; dominant-baseline: middle; }
  </style>
  <rect width="1120" height="510" fill="white"/>
  <rect x="24" y="24" width="518" height="462" rx="24" fill="#f5f8ff" stroke="#c9d9f5" stroke-width="2"/>
  <rect x="578" y="24" width="518" height="462" rx="24" fill="#f3fcfa" stroke="#b9e5da" stroke-width="2"/>
  <text x="283" y="65" class="label" text-anchor="middle">위치 정보 없음</text>
  <text x="837" y="65" class="label" text-anchor="middle">위치 정보 추가</text>

  <text x="58" y="112" class="small">문장 A</text>
  <g>
    <rect x="140" y="82" width="112" height="54" rx="12" fill="#dcedff"/><text x="196" y="109" class="token">dog</text>
    <rect x="264" y="82" width="112" height="54" rx="12" fill="#ffe6c7"/><text x="320" y="109" class="token">bites</text>
    <rect x="388" y="82" width="112" height="54" rx="12" fill="#e7dcff"/><text x="444" y="109" class="token">man</text>
  </g>
  <text x="58" y="184" class="small">문장 B</text>
  <g>
    <rect x="140" y="154" width="112" height="54" rx="12" fill="#e7dcff"/><text x="196" y="181" class="token">man</text>
    <rect x="264" y="154" width="112" height="54" rx="12" fill="#ffe6c7"/><text x="320" y="181" class="token">bites</text>
    <rect x="388" y="154" width="112" height="54" rx="12" fill="#dcedff"/><text x="444" y="181" class="token">dog</text>
  </g>
  <path d="M283 222 V274" stroke="#6a88c7" stroke-width="4" marker-end="url(#blueArrow)"/>
  <text x="283" y="250" class="small" text-anchor="middle">순서를 떼어 내면</text>
  <rect x="80" y="300" width="406" height="112" rx="18" fill="white" stroke="#8faadb" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="283" y="334" class="small" text-anchor="middle">같은 단어 카드 묶음</text>
  <rect x="134" y="354" width="94" height="42" rx="10" fill="#dcedff"/><text x="181" y="375" class="token" font-size="18">dog</text>
  <rect x="236" y="354" width="104" height="42" rx="10" fill="#ffe6c7"/><text x="288" y="375" class="token" font-size="18">bites</text>
  <rect x="348" y="354" width="104" height="42" rx="10" fill="#e7dcff"/><text x="400" y="375" class="token" font-size="18">man</text>
  <text x="283" y="450" class="small" text-anchor="middle">두 문장의 순서 차이를 알 수 없습니다.</text>

  <text x="612" y="112" class="small">문장 A</text>
  <g>
    <rect x="694" y="82" width="112" height="54" rx="12" fill="#dcedff"/><circle cx="710" cy="94" r="14" fill="#278b7d"/><text x="710" y="94" class="badge">1</text><text x="750" y="109" class="token">dog</text>
    <rect x="818" y="82" width="112" height="54" rx="12" fill="#ffe6c7"/><circle cx="834" cy="94" r="14" fill="#278b7d"/><text x="834" y="94" class="badge">2</text><text x="874" y="109" class="token">bites</text>
    <rect x="942" y="82" width="112" height="54" rx="12" fill="#e7dcff"/><circle cx="958" cy="94" r="14" fill="#278b7d"/><text x="958" y="94" class="badge">3</text><text x="998" y="109" class="token">man</text>
  </g>
  <text x="612" y="184" class="small">문장 B</text>
  <g>
    <rect x="694" y="154" width="112" height="54" rx="12" fill="#e7dcff"/><circle cx="710" cy="166" r="14" fill="#278b7d"/><text x="710" y="166" class="badge">1</text><text x="750" y="181" class="token">man</text>
    <rect x="818" y="154" width="112" height="54" rx="12" fill="#ffe6c7"/><circle cx="834" cy="166" r="14" fill="#278b7d"/><text x="834" y="166" class="badge">2</text><text x="874" y="181" class="token">bites</text>
    <rect x="942" y="154" width="112" height="54" rx="12" fill="#dcedff"/><circle cx="958" cy="166" r="14" fill="#278b7d"/><text x="958" y="166" class="badge">3</text><text x="998" y="181" class="token">dog</text>
  </g>
  <path d="M837 222 V274" stroke="#278b7d" stroke-width="4" marker-end="url(#greenArrow)"/>
  <text x="837" y="250" class="small" text-anchor="middle">위치 번호를 더하면</text>
  <rect x="634" y="300" width="406" height="112" rx="18" fill="white" stroke="#55af9d" stroke-width="3"/>
  <text x="837" y="334" class="small" text-anchor="middle">서로 다른 입력 표현</text>
  <g stroke="#278b7d" stroke-width="4" fill="none"><path d="M716 380 l16 -18 l16 18"/><path d="M814 380 l16 -18 l16 18"/><path d="M912 380 l16 -18 l16 18"/></g>
  <g stroke="#d96a45" stroke-width="4" fill="none"><path d="M716 402 l16 -18 l16 18"/><path d="M814 402 l16 -18 l16 18"/><path d="M912 402 l16 -18 l16 18"/></g>
  <text x="837" y="450" class="small" text-anchor="middle">같은 단어라도 자리가 다르면 다르게 읽습니다.</text>
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6a88c7"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#278b7d"/></marker>
  </defs>
</svg>
